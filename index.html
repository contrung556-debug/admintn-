<script>
    const SUPABASE_URL = "https://hsdbjzkxbdezysxwwtaw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_LIeDI4UVn7MEo5vURP05hA_TM4h0vFd";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cachedMembers = [];
    let cachedTemplates = [];
    let cachedGroupedProducts = [];

    checkAdminSession();

    async function checkAdminSession() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session && session.user) {
            showAdminPanel();
        } else {
            logoutAdminUI();
        }
    }

    async function loginAdminAuth() {
        let email = document.getElementById("adminEmail").value.trim();
        let pass = document.getElementById("adminPass").value.trim();

        if (!email || !pass) {
            alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
            return;
        }

        const { data, error } = await _supabase.auth.signInWithPassword({
            email: email,
            password: pass
        });

        if (error) {
            alert("Đăng nhập thất bại: " + error.message);
            return;
        }

        if (data.session) {
            alert("Đăng nhập quản trị thành công!");
            showAdminPanel();
        }
    }

    async function logoutAdmin() {
        await _supabase.auth.signOut();
        logoutAdminUI();
    }

    function logoutAdminUI() {
        document.getElementById("adminLoginBox").style.display = "block";
        document.getElementById("adminDashboard").style.display = "none";
        document.getElementById("btnLogoutAdmin").style.display = "none";
    }

    function showAdminPanel() {
        document.getElementById("adminLoginBox").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        document.getElementById("btnLogoutAdmin").style.display = "inline-block";
        loadMemberList();
        loadTemplates();
        loadProductsList();
    }

    async function postNewAccounts(event) {
        let platform = document.getElementById("postPlatform").value;
        let price = parseInt(document.getElementById("postPrice").value);
        let title = document.getElementById("postTitle").value.trim();
        let desc = document.getElementById("postDesc").value.trim();
        let rawAccs = document.getElementById("postAccounts").value.trim();

        if (isNaN(price) || price < 0 || !rawAccs) {
            alert("Vui lòng nhập giá hợp lệ và danh sách tài khoản!");
            return;
        }

        let lines = rawAccs.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) {
            alert("Danh sách tài khoản trống!");
            return;
        }

        let btnEl = event.target;
        let oldText = btnEl.innerText;
        btnEl.disabled = true;
        btnEl.innerText = "⏳ Đang đăng bán...";

        const { data, error } = await _supabase.rpc('dang_ban_tai_khoan', {
            p_platform: platform,
            p_price: price,
            p_title: title || `${platform} tài khoản`,
            p_description: desc || 'Không có mô tả.',
            p_details_array: lines
        });

        btnEl.disabled = false;
        btnEl.innerText = oldText;

        if (error || (data && !data.success)) {
            alert("Lỗi khi đăng bài: " + (error?.message || data?.message || "Không xác định"));
            return;
        }

        alert(`Đã đăng thành công ${lines.length} tài khoản lên kho!`);
        document.getElementById("postAccounts").value = "";
        loadProductsList();
    }

    async function saveCurrentAsTemplate() {
        let platform = document.getElementById("postPlatform").value;
        let price = parseInt(document.getElementById("postPrice").value) || 0;
        let title = document.getElementById("postTitle").value.trim();
        let desc = document.getElementById("postDesc").value.trim();

        if (!title && !desc) {
            alert("Vui lòng nhập ít nhất Tiêu đề hoặc Mô tả để lưu mẫu!");
            return;
        }

        let templateName = title || `${platform} (${price}đ)`;

        const { error } = await _supabase.from('post_templates').insert([
            { name: templateName, platform: platform, price: price, title: title, description: desc }
        ]);

        if (error) {
            alert("Lỗi khi lưu mẫu: " + error.message);
            return;
        }

        alert(`Đã lưu mẫu "${templateName}" thành công!`);
        loadTemplates();
    }

    async function loadTemplates() {
        const { data, error } = await _supabase.from('post_templates').select('*').order('created_at', { ascending: false });
        if (error) return;

        cachedTemplates = data || [];
        let selectEl = document.getElementById("templateSelector");
        if (!selectEl) return;

        selectEl.innerHTML = '<option value="">-- 📋 Chọn nhanh mẫu đã lưu --</option>';
        cachedTemplates.forEach((t) => {
            let opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = `📌 ${t.name} (${t.platform} - ${t.price}đ)`;
            selectEl.appendChild(opt);
        });
    }

    function applyTemplate() {
        let selectEl = document.getElementById("templateSelector");
        let templateId = selectEl.value;
        if (!templateId) return;

        let t = cachedTemplates.find(item => String(item.id) === String(templateId));
        if (!t) return;

        document.getElementById("postPlatform").value = t.platform || "Shopee";
        document.getElementById("postPrice").value = t.price || "";
        document.getElementById("postTitle").value = t.title || "";
        document.getElementById("postDesc").value = t.description || "";
    }

    async function loadProductsList() {
        const container = document.getElementById("productListContainer");
        container.innerHTML = "Đang tải và gom nhóm sản phẩm...";

        const { data, error } = await _supabase
            .from('mmo_accounts')
            .select('id, platform, price, title, description, buyer_username, created_at')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = "Lỗi khi tải sản phẩm: " + error.message;
            return;
        }

        let groupMap = {};
        (data || []).forEach(item => {
            let key = `${item.platform || ''}_${(item.title || '').trim().toLowerCase()}_${item.price || 0}`;
            if (!groupMap[key]) {
                groupMap[key] = {
                    groupKey: key,
                    platform: item.platform,
                    title: item.title,
                    price: item.price,
                    description: item.description,
                    totalCount: 0,
                    availableCount: 0,
                    soldCount: 0,
                    items: []
                };
            }
            
            groupMap[key].items.push(item);
            groupMap[key].totalCount++;
            if (item.buyer_username) {
                groupMap[key].soldCount++;
            } else {
                groupMap[key].availableCount++;
            }
        });

        cachedGroupedProducts = Object.values(groupMap);
        filterProducts();
    }

    function filterProducts() {
        let kw = document.getElementById("searchProductInput").value.toLowerCase().trim();
        let platform = document.getElementById("filterPlatform").value;

        let filtered = cachedGroupedProducts.filter(group => {
            let matchesKw = !kw || (group.title && group.title.toLowerCase().includes(kw)) || (group.description && group.description.toLowerCase().includes(kw));
            let matchesPlatform = !platform || group.platform === platform;
            return matchesKw && matchesPlatform;
        });

        renderGroupedProducts(filtered);
    }

    function renderGroupedProducts(list) {
        let container = document.getElementById("productListContainer");
        if (!list || list.length === 0) {
            container.innerHTML = "<div style='text-align:center; color:#888; font-size:12px;'>Không tìm thấy sản phẩm nào.</div>";
            return;
        }

        let html = '';
        list.forEach(g => {
            html += `
                <div class="product-card">
                    <div class="product-top">
                        <div class="product-title">
                            <span class="badge badge-blue">${g.platform || 'Khác'}</span> 
                            ${g.title || 'Không có tiêu đề'}
                        </div>
                        <div>
                            <span class="badge badge-green">Còn: ${g.availableCount}</span>
                            <span class="badge badge-red">Đã bán: ${g.soldCount}</span>
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #555; margin-bottom: 6px; white-space: pre-line;">${g.description || 'Không có mô tả.'}</div>
                    
                    <div class="product-stats">
                        <div>Giá: <b style="color: #e74c3c;">${(g.price || 0).toLocaleString('vi-VN')}đ</b></div>
                        <div>
                            <button class="btn-main btn-dark btn-sm" onclick="openViewAccsModal('${g.groupKey}')">📋 Chi tiết (${g.totalCount})</button>
                            <button class="btn-main btn-dark btn-sm" onclick="openGroupEditModal('${g.groupKey}')">✏️ Sửa/Thêm</button>
                            <button class="btn-main btn-sm" style="background-color:#c0392b;" onclick="deleteGroup('${g.groupKey}')">🗑️ Xóa</button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function openViewAccsModal(groupKey) {
        let g = cachedGroupedProducts.find(item => item.groupKey === groupKey);
        if (!g) return;

        document.getElementById("viewAccsTitle").innerText = `📋 Danh Sách Acc: ${g.title}`;
        let container = document.getElementById("subAccsListContainer");
        
        let html = '';
        g.items.forEach((acc, idx) => {
            let statusText = acc.buyer_username ? `<b style="color:#e74c3c;">Đã bán (@${acc.buyer_username})</b>` : `<b style="color:#27ae60;">Còn hàng</b>`;
            let dateStr = acc.created_at ? new Date(acc.created_at).toLocaleDateString('vi-VN') : '';
            html += `
                <div class="sub-acc-item">
                    <div>
                        <b>#${idx + 1}</b> - ${statusText} <span style="color:#888;">(${dateStr})</span>
                    </div>
                    <button class="btn-main btn-sm" style="background:#c0392b; margin:0;" onclick="deleteSingleAcc('${acc.id}')">Xóa</button>
                </div>
            `;
        });

        container.innerHTML = html;
        document.getElementById("viewAccsModal").style.display = "flex";
    }

    async function deleteSingleAcc(accId) {
        if (!confirm("Bạn có chắc muốn xóa 1 acc này không?")) return;

        const { error } = await _supabase.from('mmo_accounts').delete().eq('id', accId);
        if (error) {
            alert("Lỗi khi xóa: " + error.message);
            return;
        }

        alert("Xóa thành công!");
        closeModal("viewAccsModal");
        loadProductsList();
    }

    function openGroupEditModal(groupKey) {
        let g = cachedGroupedProducts.find(item => item.groupKey === groupKey);
        if (!g) return;

        document.getElementById("editGroupKey").value = g.groupKey;
        document.getElementById("editPlatform").value = g.platform || "Shopee";
        document.getElementById("editTitle").value = g.title || "";
        document.getElementById("editPrice").value = g.price || 0;
        document.getElementById("editDesc").value = g.description || "";
        document.getElementById("addMoreAccounts").value = "";

        document.getElementById("editProductModal").style.display = "flex";
    }

    async function saveGroupEdit() {
        let groupKey = document.getElementById("editGroupKey").value;
        let g = cachedGroupedProducts.find(item => item.groupKey === groupKey);
        if (!g) return;

        let newPlatform = document.getElementById("editPlatform").value;
        let newTitle = document.getElementById("editTitle").value.trim();
        let newPrice = parseInt(document.getElementById("editPrice").value);
        let newDesc = document.getElementById("editDesc").value.trim();
        let moreAccsRaw = document.getElementById("addMoreAccounts").value.trim();

        if (!newTitle || isNaN(newPrice)) {
            alert("Vui lòng nhập đầy đủ Tiêu đề và Giá tiền!");
            return;
        }

        let idsToUpdate = g.items.map(i => i.id);

        const { error } = await _supabase
            .from('mmo_accounts')
            .update({
                platform: newPlatform,
                title: newTitle,
                price: newPrice,
                description: newDesc
            })
            .in('id', idsToUpdate);

        if (error) {
            alert("Lỗi khi cập nhật nhóm: " + error.message);
            return;
        }

        if (moreAccsRaw) {
            let lines = moreAccsRaw.split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length > 0) {
                await _supabase.rpc('dang_ban_tai_khoan', {
                    p_platform: newPlatform,
                    p_price: newPrice,
                    p_title: newTitle,
                    p_description: newDesc,
                    p_details_array: lines
                });
            }
        }

        alert("Cập nhật thông tin thành công!");
        closeModal("editProductModal");
        loadProductsList();
    }

    async function deleteGroup(groupKey) {
        let g = cachedGroupedProducts.find(item => item.groupKey === groupKey);
        if (!g) return;

        if (!confirm(`Bạn có chắc muốn XÓA TOÀN BỘ ${g.totalCount} acc thuộc nhóm "${g.title}" này?`)) {
            return;
        }

        let idsToDelete = g.items.map(i => i.id);

        const { error } = await _supabase
            .from('mmo_accounts')
            .delete()
            .in('id', idsToDelete);

        if (error) {
            alert("Lỗi khi xóa nhóm: " + error.message);
            return;
        }

        alert("Xóa thành công nhóm sản phẩm!");
        loadProductsList();
    }

    async function clearSoldAccounts() {
        if (!confirm("Bạn có chắc chắn muốn XÓA TẤT CẢ các tài khoản ĐÃ BÁN khỏi cơ sở dữ liệu không? Action này không thể hoàn tác!")) {
            return;
        }

        const { error } = await _supabase
            .from('mmo_accounts')
            .delete()
            .not('buyer_username', 'is', null);

        if (error) {
            alert("Lỗi khi dọn dẹp tài khoản đã bán: " + error.message);
            return;
        }

        alert("Đã xóa toàn bộ tài khoản đã bán thành công!");
        loadProductsList();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    async function adjustUserBalance(specificId = null, specificAmount = null) {
        let targetId = specificId;

        if (!targetId) {
            let targetUsername = document.getElementById("targetUsername").value.trim();
            if (!targetUsername) {
                alert("Vui lòng nhập Username của khách!");
                return;
            }
            let foundUser = cachedMembers.find(u => u.username.toLowerCase() === targetUsername.toLowerCase());
            if (!foundUser) {
                alert("Không tìm thấy thành viên có username này trong danh sách!");
                return;
            }
            targetId = foundUser.id;
        }

        let amount = specificAmount !== null ? specificAmount : parseInt(document.getElementById("balanceAmount").value);

        if (!targetId || isNaN(amount)) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        const { data, error } = await _supabase.rpc('admin_cong_tien', {
            p_target_id: targetId,
            p_amount: amount
        });

        if (error || (data && !data.success)) {
            alert("Lỗi cập nhật: " + (error?.message || data?.message || "Không xác định"));
            return;
        }

        alert(`Đã cập nhật số dư thành công! Số dư mới: ${data.new_balance.toLocaleString('vi-VN')}đ`);
        document.getElementById("targetUsername").value = "";
        document.getElementById("balanceAmount").value = "";
        loadMemberList();
    }

    function quickAdjustUser(userId, username) {
        let input = prompt(`Nhập số tiền muốn cộng thêm cho @${username} (Nhập số âm để trừ tiền):`);
        if (input === null || input.trim() === "") return;
        let amount = parseInt(input);
        if (isNaN(amount)) {
            alert("Vui lòng nhập một số hợp lệ!");
            return;
        }
        adjustUserBalance(userId, amount);
    }

    // XÓA THÀNH VIÊN
    async function deleteMember(userId, username, event) {
        event.stopPropagation(); // Chặn sự kiện click nhầm vào thẻ card (để không bật prompt cộng tiền)

        if (!confirm(`CẢNH BÁO: Bạn có chắc chắn muốn XÓA VĨNH VIỄN thành viên @${username} khỏi hệ thống không?`)) {
            return;
        }

        const { error } = await _supabase.from('members').delete().eq('id', userId);
        if (error) {
            alert("Lỗi khi xóa thành viên: " + error.message);
            return;
        }

        alert(`Đã xóa thành công thành viên @${username}!`);
        loadMemberList();
    }

    // XEM LỊCH SỬ NẠP TIỀN
    async function loadDepositHistory() {
        let modal = document.getElementById("depositHistoryModal");
        let container = document.getElementById("depositHistoryContainer");
        container.innerHTML = "Đang tải lịch sử giao dịch...";
        modal.style.display = "flex";

        // Lấy lịch sử và kết nối bảng members để biết ai là người nhận
        const { data, error } = await _supabase
            .from('deposit_history')
            .select('amount, type, note, created_at, members(username)')
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) {
            container.innerHTML = "Lỗi tải lịch sử: " + error.message;
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = "<div style='text-align:center; color:#888;'>Chưa có lịch sử giao dịch nào.</div>";
            return;
        }

        let html = `
            <table style="width:100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid #ddd; background: #f8fafc;">
                        <th style="padding: 8px;">Thời gian</th>
                        <th style="padding: 8px;">Thành viên</th>
                        <th style="padding: 8px;">Số tiền</th>
                        <th style="padding: 8px;">Nội dung</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(item => {
            let timeStr = new Date(item.created_at).toLocaleString('vi-VN');
            let username = item.members ? `@${item.members.username}` : 'Khách vãng lai/Đã xóa';
            let amountColor = item.amount >= 0 ? 'color: #27ae60; font-weight:bold;' : 'color: #e74c3c; font-weight:bold;';
            let formattedAmount = (item.amount > 0 ? '+' : '') + item.amount.toLocaleString('vi-VN') + 'đ';

            html += `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 8px; color: #666; font-size: 11px;">${timeStr}</td>
                    <td style="padding: 8px; font-weight: bold;">${username}</td>
                    <td style="padding: 8px; ${amountColor}">${formattedAmount}</td>
                    <td style="padding: 8px; font-size: 11px;">${item.note || ''}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    async function loadMemberList() {
        const { data: users, error } = await _supabase.from('members').select('*').order('created_at', { ascending: false });
        if (error) {
            document.getElementById("memberListContainer").innerHTML = "Lỗi tải danh sách thành viên.";
            return;
        }

        const { data: purchases } = await _supabase.from('mmo_accounts').select('buyer_username, price').not('buyer_username', 'is', null);
        let spendMap = {};
        if (purchases) {
            purchases.forEach(item => {
                if (item.buyer_username) {
                    spendMap[item.buyer_username] = (spendMap[item.buyer_username] || 0) + (item.price || 0);
                }
            });
        }

        cachedMembers = (users || []).map(u => ({
            ...u,
            totalSpend: spendMap[u.username] || 0
        }));

        renderMembers(cachedMembers);
    }

    function renderMembers(list) {
        let container = document.getElementById("memberListContainer");
        if (!list || list.length === 0) {
            container.innerHTML = "Chưa có thành viên nào.";
            return;
        }

        let html = '';
        list.forEach(u => {
            let regTime = u.created_at ? new Date(u.created_at).toLocaleDateString('vi-VN') : 'Không rõ';
            html += `
                <div class="member-card" onclick="quickAdjustUser('${u.id}', '${u.username}')">
                    <div class="member-top">
                        <div class="member-user">👤 @${u.username}</div>
                        <button class="btn-main btn-sm" style="background:#c0392b; margin:0; padding: 4px 8px;" onclick="deleteMember('${u.id}', '${u.username}', event)">🗑️ Xóa</button>
                    </div>
                    <div class="member-time">⏱ Đăng ký: ${regTime}</div>
                    <div class="member-stats">
                        <div>Ví: <b style="color: #27ae60;">${(u.balance || 0).toLocaleString('vi-VN')}đ</b></div>
                        <div>Đã chi: <b style="color: #e74c3c;">${u.totalSpend.toLocaleString('vi-VN')}đ</b></div>
                    </div>
                    <div class="member-action-hint">⚡ Nạp / Trừ tiền (Chạm để sửa)</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function filterMembers() {
        let kw = document.getElementById("searchMemberInput").value.toLowerCase().trim();
        let filtered = cachedMembers.filter(u => u.username && u.username.toLowerCase().includes(kw));
        renderMembers(filtered);
    }
</script>
